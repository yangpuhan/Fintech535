name: Nightly LSEG refresh

# Query LSEG -> redraw docs/nightly/aapl-vol.html -> commit -> Pages republishes.
# Pages here deploys from main:/docs, so the commit alone republishes the site;
# no separate deploy workflow is needed.

on:
  workflow_dispatch:        # the "Run workflow" button on the Actions tab
  schedule:
    # 08:00 UTC Tue-Sat = 3am EST / 4am EDT, the morning after each weekday
    # session. The LSEG account allows one sign-in at a time and this job
    # will not take over an open Workspace, so it runs when that is closed.
    - cron: "0 8 * * 2-6"

concurrency:
  group: nightly-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0    # full history, so the rebase before push always finds a base

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Query LSEG and redraw the chart
        env:
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python -m nightly.refresh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nightly/aapl-vol.html docs/nightly/meta.json
          if git diff --cached --quiet; then
            echo "chart unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Nightly refresh: AAPL vs SPY through $(jq -r .through docs/nightly/meta.json)"
          # The course server also pushes price_history.json to main, so replay
          # this commit on top of anything that landed while the job ran.
          git pull --rebase origin main
          git push origin HEAD:main
