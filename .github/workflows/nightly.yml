name: Nightly LSEG refresh

# Query LSEG -> redraw docs/nightly/aapl-vol.html -> decide tomorrow's orders
# (gearwheel/orders.py -> open_orders.json, mkt/open_orders.json) -> commit
# -> Pages republishes. Pages here deploys from main:/docs, so the commit
# alone republishes the site; no separate deploy workflow is needed.

on:
  workflow_dispatch:        # the "Run workflow" button on the Actions tab
    inputs:
      dry_run:
        description: "Decide and print the orders, but commit nothing"
        type: boolean
        default: false
  schedule:
    # 03:00 UTC Tue-Sat = 10pm EST / 11pm EDT, after each weekday session:
    # the instructor's time, and the run that plans the next session.
    - cron: "0 3 * * 2-6"
    # 08:00 UTC = 3am EST, the retry. The LSEG account allows one sign-in at
    # a time and this job will not take over an open Workspace, so if the
    # evening run met one, this one tries again. GitHub starts scheduled runs
    # late (hours, on this repo); a run that starts after the open does not
    # plan the next session off a stale book (orders.py checks).
    - cron: "0 8 * * 2-6"

concurrency:
  group: nightly-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
      LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
      LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0    # full history, so the rebase before push always finds a base

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Query LSEG and redraw the chart
        id: chart
        continue-on-error: true     # the orders do not depend on the chart
        run: python -m nightly.refresh

      - name: Decide tomorrow's orders (the gear wheel)
        id: orders
        run: python -m gearwheel.orders ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and push
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nightly/aapl-vol.html docs/nightly/meta.json \
                  open_orders.json mkt/open_orders.json docs/gear/state.json docs/gear/log.json \
                  2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed; nothing to commit"
            exit 0
          fi
          git commit -m "Nightly: orders for $(jq -r .for docs/gear/state.json 2>/dev/null || echo '?'), chart through $(jq -r .through docs/nightly/meta.json)"
          # The course server also pushes price_history.json to main, so replay
          # this commit on top of anything that landed while the job ran.
          git pull --rebase origin main
          git push origin HEAD:main
